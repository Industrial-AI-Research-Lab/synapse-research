<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: folio-final-document-action.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+HK:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8f7}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-sidebar region chrome" data-region="sidebar"><!-- Warm beige narrow navigation rail with monogram, toggle, two navigation icons and connection indicator --></div>
  <div class="r-headline region text" data-region="headline"><!-- Исследование по документам, dark serif heading --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-intro region text" data-region="intro"><!-- Выберите источники и задайте исследовательский вопрос. --><p style="line-height:1.05;margin:0">intro</p></div>
  <div class="r-sources-heading region text" data-region="sources-heading"><!-- Источники, italic serif heading --><p style="line-height:1.05;margin:0">sources-heading</p></div>
  <div class="r-upload region control" data-region="upload"><!-- Outlined capsule with download icon and Добавить документы: rebuild the control's chrome from the crop (comp-spec.mjs --crop upload); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-selection region text" data-region="selection"><!-- Выбрано 3 из 6 --><p style="line-height:1.05;margin:0">selection</p></div>
  <div class="r-selection-actions region control" data-region="selection-actions"><!-- Выбрать все and Снять выбор: rebuild the control's chrome from the crop (comp-spec.mjs --crop selection-actions); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-question-heading region text" data-region="question-heading"><!-- Исследовательский вопрос, italic serif heading --><p style="line-height:1.05;margin:0">question-heading</p></div>
  <div class="r-question-input region control" data-region="question-input"><!-- Textarea with the research question and an outlined boundary: rebuild the control's chrome from the crop (comp-spec.mjs --crop question-input); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-question-selection region text" data-region="question-selection"><!-- Выбрано 3 из 6 --><p style="line-height:1.05;margin:0">question-selection</p></div>
  <div class="r-start region control" data-region="start"><!-- Olive capsule Запустить исследование with right arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop start); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-search region control" data-region="search"><!-- Outlined capsule Найти фрагменты: rebuild the control's chrome from the crop (comp-spec.mjs --crop search); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-start-hint region text" data-region="start-hint"><!-- Исследование подготовит ответ по выбранным источникам. --><p style="line-height:1.05;margin:0">start-hint</p></div>
  <div class="r-search-hint region text" data-region="search-hint"><!-- Поиск покажет фрагменты документов. --><p style="line-height:1.05;margin:0">search-hint</p></div>
  <div class="r-result-note region text" data-region="result-note"><!-- Результат и материалы сохранятся в разделе Исследования --><p style="line-height:1.05;margin:0">result-note</p></div>
  <div class="r-footer region text" data-region="footer"><!-- Synapse readiness and demonstration-data label --><p style="line-height:1.05;margin:0">footer</p></div>
  <div class="r-source-row-1 region control" data-region="source-row-1"><!-- Document row 1, checkbox, file name and metadata, open and delete controls: rebuild the control's chrome from the crop (comp-spec.mjs --crop source-row-1); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-source-row-2 region control" data-region="source-row-2"><!-- Document row 2, checkbox, file name and metadata, open and delete controls: rebuild the control's chrome from the crop (comp-spec.mjs --crop source-row-2); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-source-row-3 region control" data-region="source-row-3"><!-- Document row 3, checkbox, file name and metadata, open and delete controls: rebuild the control's chrome from the crop (comp-spec.mjs --crop source-row-3); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-source-row-4 region control" data-region="source-row-4"><!-- Document row 4, checkbox, file name and metadata, open and delete controls: rebuild the control's chrome from the crop (comp-spec.mjs --crop source-row-4); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-source-row-5 region control" data-region="source-row-5"><!-- Document row 5, checkbox, file name and metadata, open and delete controls: rebuild the control's chrome from the crop (comp-spec.mjs --crop source-row-5); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-source-row-6 region control" data-region="source-row-6"><!-- Document row 6, checkbox, file name and metadata, open and delete controls: rebuild the control's chrome from the crop (comp-spec.mjs --crop source-row-6); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-section-heads region chrome" data-region="section-heads"><!-- Shared section-header baseline, warm background and thin horizontal rule; individual headings and upload control measured separately --></div>
  <div class="r-source-selection region chrome" data-region="source-selection"><!-- Source selection fieldset on continuous warm ground, rows and thin horizontal separators; individual document controls measured separately --></div>
</main>
</body>
</html>
