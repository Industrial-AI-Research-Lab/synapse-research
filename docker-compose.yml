name: synapse-research

services:
  backend:
    build: .
    image: synapse-research:dev
    container_name: synapse-research
    ports:
      - "${PAV_PORT:-8091}:8091"
    environment:
      HOST: 0.0.0.0
      PORT: 8091
    env_file:
      - path: .env
        required: false
    volumes:
      - type: bind
        source: ./backend/data
        target: /service/backend/data
